# Two tristate_buffer instances intentionally share one net (bus) to model
# a real tri-state bus. Yosys's generic `synth` treats any multi-driver
# wire as a `check -assert` error (it has no vendor-specific tri-state/IO
# buffer cell to resolve it onto), so this program is simulation-verified
# only; see README section 13.
SYNTH=no
SYNTH_NOTE=intentional multi-driver tri-state bus; Yosys generic synth rejects multi-driver nets with no tri-state cell to map onto
